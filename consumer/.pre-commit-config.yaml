# 入れてはいけない物を commit の前で止める (全リポ共通の雛形)。
# 入れ方: リポで `pre-commit install` を1回 (新しい clone は git の template から自動で入る)。
# 一時的に1つだけ飛ばす: SKIP=<hook id> git commit ...   (--no-verify は使わない)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system            # 手元に入っている gitleaks (/usr/local/bin) を使う。Go の組み立て不要
        args: ['--config=.gitleaks.toml']
        pass_filenames: false            # gitleaks git --staged は index を自分で読む。ファイル名を渡すと「引数は1つまで」で落ちる
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$'
      - id: forbid-new-submodules
      - id: check-merge-conflict
  - repo: https://github.com/circl-tyo/repo-hygiene   # 公開リポ (複合アクションと同じ置き場)。名前の型はここ1か所
    rev: v0.1.0
    hooks:
      - id: forbid-local-artifacts
